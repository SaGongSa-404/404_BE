spring:
  config:
    import: classpath:config/cors.yml
  application:
    name: wigul-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/404_be}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-required}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-required}
            scope:
              - profile
              - email
          kakao:
            provider: kakao
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-required}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret-required}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname

server:
  servlet:
    session:
      cookie:
        same-site: lax

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId}] [userId=%X{userId}] %logger{36} - %msg%n"

app:
  purchase-comparison:
    enabled: ${PURCHASE_COMPARISON_ENABLED:false}
    allowed-user-ids: ${PURCHASE_COMPARISON_ALLOWED_USER_IDS:}
  security:
    rate-limit:
      enabled: ${APP_API_RATE_LIMIT_ENABLED:true}
      max-tracked-keys: ${APP_API_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      api:
        max-requests: ${APP_API_RATE_LIMIT_MAX_REQUESTS:600}
        window: ${APP_API_RATE_LIMIT_WINDOW:PT1M}
      authentication:
        max-requests: ${APP_AUTH_RATE_LIMIT_MAX_REQUESTS:30}
        window: ${APP_AUTH_RATE_LIMIT_WINDOW:PT1M}
      expensive-request:
        max-requests: ${APP_EXPENSIVE_RATE_LIMIT_MAX_REQUESTS:30}
        window: ${APP_EXPENSIVE_RATE_LIMIT_WINDOW:PT1M}
      health:
        max-requests: ${APP_HEALTH_RATE_LIMIT_MAX_REQUESTS:120}
        window: ${APP_HEALTH_RATE_LIMIT_WINDOW:PT1M}
  admin:
    notification-token: ${APP_ADMIN_NOTIFICATION_TOKEN:}
  auth:
    issuer: 404-backend
    jwt-secret: ${APP_JWT_SECRET:local-development-jwt-secret-change-me}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:PT2H}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:P30D}
    allowed-redirect-uri-prefixes: ${APP_ALLOWED_REDIRECT_URI_PREFIXES:sagongsa404://auth/callback,http://localhost/auth/callback,http://127.0.0.1/auth/callback,https://localhost/auth/callback,https://127.0.0.1/auth/callback}
    reviewer-token:
      enabled: ${APP_REVIEWER_TOKEN_ENABLED:false}
      require-secret: ${APP_REVIEWER_TOKEN_REQUIRE_SECRET:false}
      secret: ${APP_REVIEWER_TOKEN_SECRET:}
      rate-limit-max-attempts: ${APP_REVIEWER_TOKEN_RATE_LIMIT_MAX_ATTEMPTS:10}
      rate-limit-window: ${APP_REVIEWER_TOKEN_RATE_LIMIT_WINDOW:PT10M}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:5MB}
    max-pixels: ${APP_UPLOAD_MAX_PIXELS:20000000}
  push:
    fcm:
      enabled: ${APP_PUSH_FCM_ENABLED:false}
      credentials-location: ${APP_PUSH_FCM_CREDENTIALS_LOCATION:}
  shopping:
    import:
      max-response-bytes: ${SHOPPING_IMPORT_MAX_RESPONSE_BYTES:1000000}
      shared-crawl:
        coalescing-enabled: ${SHOPPING_IMPORT_COALESCING_ENABLED:true}
        cache-enabled: ${SHOPPING_IMPORT_CACHE_ENABLED:true}
        success-ttl: ${SHOPPING_IMPORT_CACHE_SUCCESS_TTL:PT5M}
        failure-ttl: ${SHOPPING_IMPORT_CACHE_FAILURE_TTL:PT30S}
      sync-bridge:
        enabled: ${SHOPPING_IMPORT_SYNC_QUEUE_ENABLED:true}
        wait-timeout: ${SHOPPING_IMPORT_SYNC_WAIT_TIMEOUT:PT25S}
        poll-interval: ${SHOPPING_IMPORT_SYNC_POLL_INTERVAL:PT0.5S}
      job-worker:
        enabled: ${SHOPPING_IMPORT_JOB_WORKER_ENABLED:true}
        max-queue-size: ${SHOPPING_IMPORT_JOB_MAX_QUEUE_SIZE:100}
        max-active-per-user: ${SHOPPING_IMPORT_JOB_MAX_ACTIVE_PER_USER:1}
        concurrency: ${SHOPPING_IMPORT_JOB_CONCURRENCY:1}
        max-attempts: ${SHOPPING_IMPORT_JOB_MAX_ATTEMPTS:2}
        fixed-delay-ms: ${SHOPPING_IMPORT_JOB_FIXED_DELAY_MS:500}
        recovery-delay-ms: ${SHOPPING_IMPORT_JOB_RECOVERY_DELAY_MS:60000}
        cleanup-delay-ms: ${SHOPPING_IMPORT_JOB_CLEANUP_DELAY_MS:3600000}
        stale-timeout: ${SHOPPING_IMPORT_JOB_STALE_TIMEOUT:PT5M}
        retention: ${SHOPPING_IMPORT_JOB_RETENTION:P7D}
      kream-proxy:
        enabled: ${SHOPPING_IMPORT_KREAM_PROXY_ENABLED:false}
        type: ${SHOPPING_IMPORT_KREAM_PROXY_TYPE:SOCKS}
        host: ${SHOPPING_IMPORT_KREAM_PROXY_HOST:}
        port: ${SHOPPING_IMPORT_KREAM_PROXY_PORT:1080}
      ably-api:
        enabled: ${SHOPPING_IMPORT_ABLY_API_ENABLED:true}
        anonymous-token: ${SHOPPING_IMPORT_ABLY_ANONYMOUS_TOKEN:}
        timeout: ${SHOPPING_IMPORT_ABLY_API_TIMEOUT:PT5S}
      browser-fetch:
        enabled: ${SHOPPING_IMPORT_BROWSER_FETCH_ENABLED:true}
        timeout: ${SHOPPING_IMPORT_BROWSER_FETCH_TIMEOUT:PT30S}
        render-wait: ${SHOPPING_IMPORT_BROWSER_RENDER_WAIT:PT5S}
        network-idle-timeout: ${SHOPPING_IMPORT_BROWSER_NETWORK_IDLE_TIMEOUT:PT2S}

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:9090}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
