springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET:}
    allowed-redirect-uri-prefixes: ${APP_ALLOWED_REDIRECT_URI_PREFIXES:sagongsa404://auth/callback}
    trusted-user-id-header:
      enabled: false
    reviewer-token:
      enabled: ${APP_REVIEWER_TOKEN_ENABLED:false}
      require-secret: ${APP_REVIEWER_TOKEN_REQUIRE_SECRET:false}
      secret: ${APP_REVIEWER_TOKEN_SECRET:}
  shopping:
    import:
      browser-fetch:
        enabled: ${SHOPPING_IMPORT_BROWSER_FETCH_ENABLED:true}
