name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          printf '=== Application memory and actual health request timings ===\n'
          pid="$(systemctl show wigul-backend -p MainPID --value)"
          python3 - "$pid" <<'PY_REMOTE'
          import sys,time,urllib.request,pathlib
          pid=sys.argv[1];p=pathlib.Path('/proc')/pid
          for line in (p/'status').read_text().splitlines():
           if line.startswith(('VmRSS:','VmSwap:','Threads:')):print(line)
          def faults():
           fields=(p/'stat').read_text().rsplit(')',1)[1].split()
           return int(fields[9])
          for i in range(5):
           before=faults();t=time.monotonic()
           try:
            with urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=15) as r:r.read();status=r.status
           except Exception as e:status=type(e).__name__
           print('health',i+1,'status',status,'elapsed_ms',round((time.monotonic()-t)*1000,2),'java_major_page_faults',faults()-before)
          PY_REMOTE
          printf '=== Recent slow SQL summaries (literals omitted) ===\n'
          sudo -n tail -n 400 /var/log/postgresql/postgresql-15-main.log | python3 -c '
          import sys,re,hashlib,collections
          n=0;probe=0;b=collections.defaultdict(list)
          for line in sys.stdin:
           m=re.search(r"duration:\s*([\d.]+)\s*ms\s+(?:execute [^:]*:|statement:|parse [^:]*:|bind [^:]*:)\s*(.*)",line)
           if not m:continue
           ms=float(m[1]);q=m[2]
           if "slow_query_instrumentation_probe" in q:probe+=1;continue
           q=re.sub(r"\x27(?:\x27\x27|[^\x27])*\x27","?",q)
           q=re.sub(r"\b\d+(?:\.\d+)?\b","?",q)
           fp=hashlib.sha256(q.encode()).hexdigest()[:16]
           table=re.findall(r"(?:from|join|update|into)\s+([a-zA-Z_][a-zA-Z_0-9.]*)",q,re.I)
           b[(fp,tuple(table))].append(ms);n+=1
          print("instrumentation_probe_records",probe,"application_duration_records",n)
          for (fp,t),v in sorted(b.items(),key=lambda kv:sum(kv[1]),reverse=True)[:15]:print("fingerprint",fp,"tables",t,"n",len(v),"mean_ms",round(sum(v)/len(v),3),"max_ms",max(v))
          '
          REMOTE_DIAGNOSTIC
