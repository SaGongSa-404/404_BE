name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          printf '=== Historical latency and pool warnings across retained application journal ===\n'
          sudo -n journalctl -u wigul-backend --since '2026-05-01' --no-pager -o json --grep='request completed|Thread starvation|clock leap|OutOfMemoryError|GC overhead|SQL_SLOW|Slow query' | python3 -c '
          import sys,json,re,collections,heapq,datetime
          rows=[];warnings=[];n=0
          for line in sys.stdin:
           try:x=json.loads(line);msg=x.get("MESSAGE","");ts=datetime.datetime.fromtimestamp(int(x["__REALTIME_TIMESTAMP"])/1e6,datetime.timezone.utc).isoformat()
           except (ValueError,TypeError,KeyError):continue
           m=re.search(r"request completed method=(\S+) path=(\S+) status=(\d+) durationMs=(\d+)",msg)
           if m:
            n+=1;path=m[2].split("?")[0];path=re.sub(r"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}",":id",path)
            if path.startswith("/api/"):rows.append((int(m[4]),ts,m[1],path,int(m[3])))
           elif re.search(r"Thread starvation|clock leap|OutOfMemoryError|GC overhead|SQL_SLOW|Slow query",msg,re.I):
            msg=re.sub(r"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}","[ID]",msg);msg=re.sub(r"userId=[^\]]*","userId=[REDACTED]",msg);warnings.append((ts,msg[:350]))
          print("completed_requests_scanned",n,"api_requests",len(rows),"resource_warning_records",len(warnings))
          for row in sorted(rows,reverse=True)[:25]:print("historical_app_request",row)
          for row in warnings[-15:]:print("historical_resource_warning",row)
          '
          printf '=== Caddy error context for October 25 ===\n'
          sudo -n journalctl -u caddy --since '2026-10-25 10:14:30 UTC' --until '2026-10-25 10:16:00 UTC' --no-pager -o json | python3 -c '
          import sys,json,re,datetime
          for line in sys.stdin:
           try:
            x=json.loads(line);m=json.loads(x.get("MESSAGE","{}"));msg=m.get("msg","");msg=re.sub(r"https?://\S+","[URL]",msg);msg=re.sub(r"\b\d{1,3}(?:\.\d{1,3}){3}\b","[IP]",msg)
            print("proxy_error",datetime.datetime.fromtimestamp(int(x["__REALTIME_TIMESTAMP"])/1e6,datetime.timezone.utc).isoformat(),"logger",m.get("logger"),"message",msg[:220],"duration",m.get("duration"),"status",m.get("status"))
           except (ValueError,TypeError,KeyError):continue
          '
          REMOTE_DIAGNOSTIC
