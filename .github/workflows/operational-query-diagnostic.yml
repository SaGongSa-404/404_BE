name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          printf '=== Historical log file inventory ===\n'
          sudo -n find /var/log "$HOME/404_BE" /opt/wigul -maxdepth 4 -type f \( -iname '*.log*' -o -iname '*.out' -o -iname '*metrics*.csv' -o -iname '*slow*' \) -printf '%p %s bytes\n' 2>/dev/null | head -100 || true
          printf '=== Historical service names ===\n'
          sudo -n journalctl -F _SYSTEMD_UNIT --no-pager | python3 -c 'import sys;print("".join(x for x in sys.stdin if any(k in x.lower() for k in ["wigul","backend","postgres","caddy"])))'
          printf '=== Slow request dates and IDs, no personal data ===\n'
          sudo -n python3 - <<'PY_REMOTE'
          import pathlib,gzip,json,datetime,re,heapq
          rows=[];n=0
          for p in pathlib.Path('/var/log/caddy').glob('wigul-access*'):
           if not p.is_file():continue
           with (gzip.open if p.suffix=='.gz' else open)(p,'rt',errors='replace') as f:
            for line in f:
             try:
              x=json.loads(line);r=x.get('request',{});uri=r.get('uri','').split('?')[0];duration=float(x.get('duration',0))
              if not uri.startswith('/api/') or duration<.5:continue
              uri=re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}',':id',uri);uri=re.sub(r'/\d+(?=/|$)','/:id',uri)
              h=x.get('resp_headers',{});rid=next((v for k,v in h.items() if k.lower()=='x-request-id'),[])
              if isinstance(rid,list):rid=rid[0] if rid else ''
              if not re.fullmatch(r'[a-zA-Z0-9._-]{1,100}',str(rid)):rid=''
              rows.append((duration,datetime.datetime.fromtimestamp(x['ts'],datetime.timezone.utc).isoformat(),r.get('method'),uri,x.get('status'),rid))
             except (ValueError,TypeError,KeyError):continue
          for row in sorted(rows,reverse=True)[:35]:print('slow_http',row)
          PY_REMOTE
          REMOTE_DIAGNOSTIC
