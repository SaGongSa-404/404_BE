name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          printf '=== Request-specific application log context ===\n'
          for window in '2026-10-06 05:26:45 UTC|2026-10-06 05:28:00 UTC' '2026-08-19 14:14:45 UTC|2026-08-19 14:16:30 UTC' '2026-10-25 10:14:30 UTC|2026-10-25 10:16:00 UTC'; do
            start="${window%%|*}"; end="${window#*|}"
            echo "window $start to $end"
            sudo -n journalctl -u wigul-backend -u postgresql@15-main -u caddy --since "$start" --until "$end" --no-pager -o json | python3 -c '
          import sys,json,re,datetime,collections
          rows=[];counts=collections.Counter()
          def clean(s):
           s=re.sub(r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+","[JWT]",s)
           s=re.sub(r"https?://[^\s\x22\x27]+","[URL]",s)
           s=re.sub(r"[a-zA-Z0-9_.+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}","[EMAIL]",s)
           s=re.sub(r"\b\d{1,3}(?:\.\d{1,3}){3}\b","[IP]",s)
           s=re.sub(r"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}","[ID]",s)
           s=re.sub(r"\x27[^\x27]*\x27|\x22[^\x22]*\x22","[VALUE]",s)
           s=re.sub(r"(?i)(password|token|secret|authorization|cookie)\s*[=:]\s*[^\s,;]+",r"\1=[REDACTED]",s)
           return s[:450]
          for line in sys.stdin:
           try:x=json.loads(line);msg=x.get("MESSAGE","");counts[x.get("_SYSTEMD_UNIT","?")]+=1
           except (ValueError,KeyError,TypeError):continue
           if re.search(r"ERROR|WARN|Exception|SQL|query|duration|elapsed|Hikari|GC\(|OutOfMemory|requestId=|upstream|context canceled",msg,re.I):
            if msg.lstrip().startswith("{"):continue
            ts=datetime.datetime.fromtimestamp(int(x["__REALTIME_TIMESTAMP"])/1e6,datetime.timezone.utc).isoformat();rows.append((ts,x.get("_SYSTEMD_UNIT"),clean(msg)))
          print("total_records_by_service",dict(counts),"relevant_records",len(rows))
          for row in rows[:75]:print("context",row)
          '
          done
          printf '=== Standalone app.log ===\n'
          python3 - <<'PY_REMOTE'
          from pathlib import Path
          import re,collections
          p=Path.home()/'404_BE/app.log'
          if p.exists():
           s=p.read_text(errors='replace');dates=re.findall(r'\b20\d\d-\d\d-\d\d',s)
           print('app_log_bytes',p.stat().st_size,'date_range',min(dates) if dates else None,max(dates) if dates else None)
           for name,pattern in [('slow_sql',r'Slow query|duration:|SQL_SLOW'),('timeout',r'timeout|timed out'),('db_exception',r'PSQLException|SQLState:')]:print('app_log_category',name,len(re.findall(pattern,s,re.I)))
          PY_REMOTE
          printf '=== Retained resource records ===\n'
          command -v sar || true
          sudo -n find /var/log/sysstat /var/log/sa -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | tail -12 || true
          REMOTE_DIAGNOSTIC
