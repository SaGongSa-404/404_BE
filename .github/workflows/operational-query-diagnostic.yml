name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          for window in '2026-07-08 11:18:30 UTC|2026-07-08 11:26:00 UTC' '2026-07-13 10:26:00 UTC|2026-07-13 10:29:00 UTC' '2026-06-19 09:52:45 UTC|2026-06-19 09:54:30 UTC'; do
           start="${window%%|*}";end="${window#*|}";echo "historical_window $start to $end"
           sudo -n journalctl -u wigul-backend -u postgresql@15-main --since "$start" --until "$end" --no-pager -o json | python3 -c '
          import sys,json,re,datetime,collections
          n=0;out=[];types=collections.Counter()
          def clean(s):
           s=re.sub(r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+","[JWT]",s)
           s=re.sub(r"https?://[^\s\x22\x27]+","[URL]",s);s=re.sub(r"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}","[ID]",s)
           s=re.sub(r"[a-zA-Z0-9_.+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}","[EMAIL]",s)
           s=re.sub(r"\b\d{1,3}(?:\.\d{1,3}){3}\b","[IP]",s)
           s=re.sub(r"\x27[^\x27]*\x27|\x22[^\x22]*\x22","[VALUE]",s)
           return s[:430]
          for line in sys.stdin:
           try:x=json.loads(line);msg=x.get("MESSAGE","");n+=1
           except (ValueError,TypeError,KeyError):continue
           for e in re.findall(r"\b\w+(?:Exception|Error)\b",msg):types[e]+=1
           if re.search(r"WARN|ERROR|Caused by:|Thread starvation|OutOfMemory|Timeout.*exceeded|durationMs=\d{5,}|HikariPool.*(Connection|timeout)",msg):
            ts=datetime.datetime.fromtimestamp(int(x["__REALTIME_TIMESTAMP"])/1e6,datetime.timezone.utc).isoformat();out.append((ts,clean(msg)))
          print("window_records",n,"exception_types",dict(types),"selected_records",len(out))
          for row in out[:80]:print("historical_context",row)
          '
           sudo -n journalctl -k --since "$start" --until "$end" --no-pager -o cat --grep='Out of memory|oom-kill|Killed process|blocked for more than|memory pressure' | python3 -c 'import sys; rows=list(sys.stdin);print("kernel_memory_warning_records",len(rows))'
          done
          REMOTE_DIAGNOSTIC
