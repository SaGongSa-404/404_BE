name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          printf '=== Entire retained journal SQL error search ===\n'
          sudo -n journalctl -u wigul-backend --since '2026-05-01' --no-pager -o json --grep='Slow query took|HHH000117|SQL_SLOW|QueryTimeoutException|SQLTimeoutException|statement timeout|LockAcquisitionException|deadlock detected|CannotAcquireLockException|Connection is not available|CannotGetJdbcConnectionException|too many clients|PSQLException|SQLState:' | python3 -c '
          import sys,json,re,collections,datetime
          counts=collections.Counter();states=collections.Counter();messages=collections.Counter();dates=[];n=0
          for line in sys.stdin:
           try:x=json.loads(line);msg=x.get("MESSAGE","");n+=1;ts=int(x["__REALTIME_TIMESTAMP"])/1e6;dates.append(datetime.datetime.fromtimestamp(ts,datetime.timezone.utc).date().isoformat())
           except (ValueError,KeyError,TypeError):continue
           for k,pat in {"slow_query":r"Slow query took|HHH000117|SQL_SLOW", "query_timeout":r"QueryTimeoutException|SQLTimeoutException|statement timeout", "lock_timeout":r"LockAcquisitionException|deadlock detected|CannotAcquireLockException", "connection_timeout":r"Connection is not available|CannotGetJdbcConnectionException|too many clients"}.items():
            if re.search(pat,msg,re.I):counts[k]+=1
           for state in re.findall(r"SQLState:\s*([0-9A-Z]{5})",msg):states[state]+=1
           m=re.search(r"PSQLException:\s*(.*)",msg)
           if m:
            text=re.sub(r"\x27[^\x27]*\x27|\x22[^\x22]*\x22","?",m[1]);text=re.sub(r"\b\d+\b","?",text);messages[text[:150]]+=1
          print("matching_records",n,"date_range",min(dates) if dates else None,max(dates) if dates else None,"timing_categories",dict(counts),"sqlstates",dict(states))
          for msg,n in messages.most_common(12):print("sanitized_error_category",msg,"records",n)
          '
          REMOTE_DIAGNOSTIC
