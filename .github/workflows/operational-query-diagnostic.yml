name: Operational slow query observation
on:
  push:
    branches: [diagnostics/operational-slow-query-20261114]
    paths: [.github/workflows/operational-query-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify slow SQL logging
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_SSH_KEY_B64: ${{ secrets.GCP_VM_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$GCP_VM_SSH_KEY_B64" | base64 -d > ~/.ssh/diagnostic_key
          chmod 600 ~/.ssh/diagnostic_key
          ssh-keyscan -T 10 -H "$GCP_VM_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/diagnostic_key -o BatchMode=yes -o ConnectTimeout=15 "$GCP_VM_USER@$GCP_VM_HOST" 'bash -s' <<'REMOTE_DIAGNOSTIC'
          set -euo pipefail
          umask 077
          state_dir="$HOME/404_BE/.diagnostics/slow-query-20261114"
          mkdir -p "$state_dir"
          unset PGOPTIONS
          printf '=== Capture rollback commands ===\n'
          if [ ! -e "$state_dir/rollback.sql" ]; then
            sudo -n -u postgres psql -X -Atv ON_ERROR_STOP=1 <<'SQL' > "$state_dir/rollback.sql"
          select case when exists (select 1 from pg_file_settings f where f.name=s.name and f.sourcefile like '%/postgresql.auto.conf' and f.applied) then format('ALTER SYSTEM SET %I = %L;',s.name,s.setting) else format('ALTER SYSTEM RESET %I;',s.name) end from pg_settings s where name in ('log_min_duration_statement','log_parameter_max_length','log_parameter_max_length_on_error');
          select 'SELECT pg_reload_conf();';
          SQL
          fi
          printf '=== Enable slow query observation ===\n'
          sudo -n -u postgres psql -X -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET log_parameter_max_length = '0';
          ALTER SYSTEM SET log_parameter_max_length_on_error = '0';
          ALTER SYSTEM SET log_min_duration_statement = '250ms';
          SELECT pg_reload_conf();
          SQL
          sudo -n -u postgres psql -X -v ON_ERROR_STOP=1 <<'SQL'
          select name,setting,pending_restart from pg_settings where name in ('log_min_duration_statement','log_parameter_max_length','log_parameter_max_length_on_error');
          select pg_postmaster_start_time();
          -- This is an explicit instrumentation probe, excluded from application findings.
          select pg_sleep(0.3) /* slow_query_instrumentation_probe */;
          SQL
          printf '=== Recent slow SQL summaries (literals omitted) ===\n'
          sudo -n tail -n 400 /var/log/postgresql/postgresql-15-main.log | python3 -c '
          import sys,re,hashlib,collections
          n=0;probe=0;b=collections.defaultdict(list)
          for line in sys.stdin:
           m=re.search(r"duration:\s*([\d.]+)\s*ms\s+(?:execute [^:]*:|statement:|parse [^:]*:|bind [^:]*:)\s*(.*)",line)
           if not m:continue
           ms=float(m[1]);q=m[2]
           if "slow_query_instrumentation_probe" in q:probe+=1;continue
           q=re.sub(r"\x27(?:\x27\x27|[^\x27])*\x27","?",q)
           q=re.sub(r"\b\d+(?:\.\d+)?\b","?",q)
           fp=hashlib.sha256(q.encode()).hexdigest()[:16]
           table=re.findall(r"(?:from|join|update|into)\s+([a-zA-Z_][a-zA-Z_0-9.]*)",q,re.I)
           b[(fp,tuple(table))].append(ms);n+=1
          print("instrumentation_probe_records",probe,"application_duration_records",n)
          for (fp,t),v in sorted(b.items(),key=lambda kv:sum(kv[1]),reverse=True)[:15]:print("fingerprint",fp,"tables",t,"n",len(v),"mean_ms",round(sum(v)/len(v),3),"max_ms",max(v))
          '
          printf '=== Health ===\n'
          systemctl is-active wigul-backend
          curl -fsS --max-time 15 -o /dev/null -w 'health_http=%{http_code} total_s=%{time_total}\n' http://127.0.0.1:8080/health
          REMOTE_DIAGNOSTIC
