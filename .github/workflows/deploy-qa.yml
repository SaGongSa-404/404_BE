name: Deploy QA Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: qa-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build and test bootJar
        run: ./gradlew clean test bootJar --no-daemon

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} \
            "whoami && hostname"

      - name: Upload candidate jar
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} \
            "mkdir -p /home/${{ secrets.GCP_VM_USER }}/404_BE/build/libs"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            build/libs/wigul-backend-0.0.1-SNAPSHOT.jar \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:/home/${{ secrets.GCP_VM_USER }}/404_BE/build/libs/wigul-backend-0.0.1-SNAPSHOT.jar.candidate-${{ github.sha }}

      - name: Deploy through 8081 standby
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} \
            'bash -s' <<'REMOTE_DEPLOY'
          set -Eeuo pipefail

          APP_DIR="/home/${{ secrets.GCP_VM_USER }}/404_BE"
          JAR_NAME="wigul-backend-0.0.1-SNAPSHOT.jar"
          ACTIVE_JAR="$APP_DIR/build/libs/$JAR_NAME"
          CANDIDATE_JAR="$ACTIVE_JAR.candidate-${{ github.sha }}"
          ENV_FILE="$APP_DIR/.env.systemd"
          CADDY_FILE="/etc/caddy/Caddyfile"
          STANDBY_PID="/tmp/wigul-backend-standby.pid"
          STANDBY_LOG="/tmp/wigul-backend-standby-${{ github.sha }}.log"
          TS="$(date +%Y%m%d_%H%M%S)"
          ACTIVE_BACKUP="$ACTIVE_JAR.bak.$TS"
          CADDY_BACKUP="/etc/caddy/Caddyfile.bak.deploy.$TS"
          CADDY_ON_8081=0
          STANDBY_MANAGEMENT_PORT=9091
          SYSTEMD_MANAGEMENT_OVERRIDE=0

          cleanup() {
            code=$?
            if [ "$code" -eq 0 ]; then
              return
            fi

            if [ "${SYSTEMD_MANAGEMENT_OVERRIDE:-0}" = "1" ]; then
              sudo -n systemctl unset-environment MANAGEMENT_SERVER_PORT || true
            fi

            echo "::error::8081 standby deploy failed. exit=$code"
            if [ "${CADDY_ON_8081:-0}" = "1" ]; then
              echo "::warning::Caddy remains on 8081 standby. Do not stop the standby process until 8080 is recovered."
              sudo -n sed -n '1,120p' "$CADDY_FILE" || true
              ss -ltnp 2>/dev/null | grep -E ':8080|:8081|:9090|:9091|:9092|:80|:443' || true
              if [ -n "${CADDY_SITE:-}" ]; then
                curl -skfsS "https://$CADDY_SITE/health" || true
                echo
              fi
            else
              if [ -f "$STANDBY_PID" ]; then
                kill "$(cat "$STANDBY_PID")" 2>/dev/null || true
                rm -f "$STANDBY_PID"
              fi
              if [ -f "$CADDY_BACKUP" ]; then
                sudo -n cp "$CADDY_BACKUP" "$CADDY_FILE" || true
                sudo -n systemctl reload caddy || true
              fi
            fi
            exit "$code"
          }
          trap cleanup EXIT

          wait_health() {
            port="$1"
            label="$2"
            max_attempts="$3"

            for i in $(seq 1 "$max_attempts"); do
              if curl -fsS "http://127.0.0.1:$port/health"; then
                echo
                echo "$label health OK"
                return 0
              fi

              echo "waiting $label health... $i/$max_attempts"
              sleep 3
            done

            echo "::error::$label health failed"
            return 1
          }

          require_loopback_listener() {
            port="$1"
            label="$2"

            if ss -ltnH | awk -v port="$port" '
              $4 ~ (":" port "$") {
                found = 1
                if ($4 !~ ("^127\\.0\\.0\\.1:" port "$")
                    && $4 !~ ("^\\[::1\\]:" port "$")) {
                  public = 1
                }
              }
              END { exit (!found || public) }
            '; then
              echo "$label is listening on loopback only"
              return 0
            fi

            echo "::error::$label must listen on loopback only"
            ss -ltnp 2>/dev/null | grep ":$port " || true
            return 1
          }

          require_sensitive_path_block() {
            status="$(
              curl -sSko /dev/null \
                -w '%{http_code}' \
                "https://$CADDY_SITE/.env"
            )"
            if [ "$status" != "404" ]; then
              echo "::error::Caddy must block sensitive paths before proxying; /.env returned $status"
              return 1
            fi
            echo "Caddy sensitive-path block OK"
          }

          wait_not_listening() {
            port="$1"
            label="$2"
            max_attempts="$3"

            for i in $(seq 1 "$max_attempts"); do
              if ! ss -ltn | grep -q ":$port "; then
                echo "$label stopped"
                return 0
              fi

              echo "waiting $label stop... $i/$max_attempts"
              sleep 1
            done

            echo "::error::$label is still listening"
            return 1
          }

          prune_deploy_artifacts() {
            mapfile -t jar_backups < <(
              find "$APP_DIR/build/libs" -maxdepth 1 -type f \
                -name "$JAR_NAME.bak.*" -printf '%T@ %p\n' \
                | sort -nr \
                | cut -d' ' -f2-
            )
            if ((${#jar_backups[@]} > 2)); then
              printf 'removing old jar backup: %s\n' "${jar_backups[@]:2}"
              rm -- "${jar_backups[@]:2}"
            fi

            find "$APP_DIR/build/libs" -maxdepth 1 -type f \
              \( -name "$JAR_NAME.candidate-*" -o -name "$JAR_NAME.pre-worker12-test.*" \) \
              -print -delete

            if [ -d "$APP_DIR/releases" ]; then
              mapfile -t manual_releases < <(
                find "$APP_DIR/releases" -maxdepth 1 -type f -name '*.jar' -printf '%T@ %p\n' \
                  | sort -nr \
                  | cut -d' ' -f2-
              )
              if ((${#manual_releases[@]} > 1)); then
                printf 'removing old manual release: %s\n' "${manual_releases[@]:1}"
                rm -- "${manual_releases[@]:1}"
              fi
            fi
          }

          fail_preflight() {
            echo "::error::$1"
            exit 1
          }

          require_env() {
            name="$1"
            value="${!name:-}"
            if [ -z "$value" ]; then
              fail_preflight "$name must be set in $ENV_FILE"
            fi
          }

          require_secret_length() {
            name="$1"
            value="${!name:-}"
            if [ "${#value}" -lt 32 ]; then
              fail_preflight "$name must be at least 32 characters"
            fi
          }

          require_reviewer_seed() {
            require_env SPRING_DATASOURCE_URL
            require_env SPRING_DATASOURCE_USERNAME

            case "$SPRING_DATASOURCE_URL" in
              jdbc:postgresql://*/*)
                ;;
              *)
                fail_preflight "SPRING_DATASOURCE_URL must be a jdbc:postgresql:// URL for reviewer seed preflight"
                ;;
            esac

            jdbc_target="${SPRING_DATASOURCE_URL#jdbc:postgresql://}"
            jdbc_target="${jdbc_target%%\?*}"
            db_host_port="${jdbc_target%%/*}"
            db_name="${jdbc_target#*/}"
            db_host="${db_host_port%%:*}"
            db_port="5432"
            if [ "$db_host_port" != "$db_host" ]; then
              db_port="${db_host_port##*:}"
            fi

            reviewer_seed_count="$(
              PGPASSWORD="${SPRING_DATASOURCE_PASSWORD:-}" psql \
                -h "$db_host" \
                -p "$db_port" \
                -U "$SPRING_DATASOURCE_USERNAME" \
                -d "$db_name" \
                -Atv ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from users u
          join social_accounts sa on sa.user_id = u.id
          join user_profiles up on up.user_id = u.id
          where u.id = '40400000-0000-0000-0000-000000000055'::uuid
            and u.status = 'ACTIVE'
            and u.onboarding_status = 'COMPLETED'
            and sa.provider = 'KAKAO'
            and sa.provider_user_id = 'app-reviewer-fixed';
          SQL
            )"

            if [ "$reviewer_seed_count" != "1" ]; then
              fail_preflight "App reviewer seed must exist in users, social_accounts, and user_profiles"
            fi
          }

          switch_caddy() {
            port="$1"
            tmp_file="$(mktemp)"

            cat > "$tmp_file" <<EOF
          $CADDY_SITE {
              log {
                  output file /var/log/caddy/wigul-access.log {
                      roll_size 10MiB
                      roll_keep 10
                      roll_keep_for 720h
                  }
                  format json
              }

              @sensitive path_regexp sensitive (?i)^/(?:\\.env(?:[./_-].*)?|\\.git(?:/.*)?|manager(?:/.*)?|cgi-bin(?:/.*)?)$
              respond @sensitive 404

              reverse_proxy 127.0.0.1:$port
          }
          EOF

            sudo -n cp "$tmp_file" "$CADDY_FILE"
            rm -f "$tmp_file"
            sudo -n caddy fmt --overwrite "$CADDY_FILE"
            sudo -n caddy validate --config "$CADDY_FILE"
            sudo -n systemctl reload caddy
          }

          echo "===== deploy start ====="
          echo "ts=$TS"
          echo "candidate=$CANDIDATE_JAR"
          echo "standby_log=$STANDBY_LOG"

          test -f "$CANDIDATE_JAR"
          test -f "$ACTIVE_JAR"
          test -f "$ENV_FILE"
          systemctl is-active --quiet caddy
          systemctl is-active --quiet postgresql@15-main

          CADDY_SITE="$(sudo -n awk 'NF && $1 !~ /^#/ && $NF == "{" { print $1; exit }' "$CADDY_FILE")"
          if [ -z "$CADDY_SITE" ]; then
            echo "::error::Could not detect Caddy site from $CADDY_FILE"
            exit 1
          fi
          echo "caddy_site=$CADDY_SITE"

          set -a
          . "$ENV_FILE"
          set +a

          require_env SPRING_PROFILES_ACTIVE
          if [ "$SPRING_PROFILES_ACTIVE" != "prod" ]; then
            fail_preflight "SPRING_PROFILES_ACTIVE must be prod"
          fi

          if [ "${SERVER_ADDRESS:-127.0.0.1}" != "127.0.0.1" ]; then
            fail_preflight "SERVER_ADDRESS must be 127.0.0.1 when set"
          fi

          require_env APP_JWT_SECRET
          if [ "$APP_JWT_SECRET" = "local-development-jwt-secret-change-me" ]; then
            fail_preflight "APP_JWT_SECRET must not use the development default"
          fi
          require_secret_length APP_JWT_SECRET

          if [ "${APP_AUTH_TRUSTED_USER_ID_HEADER_ENABLED:-false}" = "true" ]; then
            fail_preflight "APP_AUTH_TRUSTED_USER_ID_HEADER_ENABLED must not be true"
          fi

          if [ "${APP_REVIEWER_TOKEN_ENABLED:-true}" != "false" ]; then
            require_reviewer_seed
          fi

          if [ "${APP_REVIEWER_TOKEN_ENABLED:-true}" != "false" ] && [ "${APP_REVIEWER_TOKEN_REQUIRE_SECRET:-false}" = "true" ]; then
            require_env APP_REVIEWER_TOKEN_SECRET
            require_secret_length APP_REVIEWER_TOKEN_SECRET
          fi

          if [ "${SHOPPING_IMPORT_BROWSER_FETCH_ENABLED:-true}" != "true" ]; then
            fail_preflight "SHOPPING_IMPORT_BROWSER_FETCH_ENABLED must be true for private test"
          fi

          case "${APP_ALLOWED_REDIRECT_URI_PREFIXES:-}" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              fail_preflight "APP_ALLOWED_REDIRECT_URI_PREFIXES must not include local hosts"
              ;;
          esac

          if grep -Eq 'reverse_proxy (localhost|127\.0\.0\.1):8081' "$CADDY_FILE"; then
            echo
            echo "===== recover previous 8081 standby fallback ====="
            CADDY_ON_8081=1
            test -f "$STANDBY_PID"
            kill -0 "$(cat "$STANDBY_PID")"
            wait_health 8081 "existing 8081 standby" 20
            require_loopback_listener 8081 "existing 8081 standby"

            STANDBY_MANAGEMENT_PORT=9092
            sudo -n systemctl set-environment MANAGEMENT_SERVER_PORT=9091
            SYSTEMD_MANAGEMENT_OVERRIDE=1
            sudo -n systemctl restart wigul-backend
            wait_health 8080 "8080 recovery" 120
            require_loopback_listener 8080 "8080 recovery"
            curl -fsS -o /dev/null http://127.0.0.1:9091/actuator/prometheus

            switch_caddy 8080
            CADDY_ON_8081=0
            curl -skfsS "https://$CADDY_SITE/health"
            echo
            require_sensitive_path_block

            kill "$(cat "$STANDBY_PID")" 2>/dev/null || true
            rm -f "$STANDBY_PID"
            wait_not_listening 8081 "previous 8081 standby" 20
            wait_not_listening 9090 "previous standby management" 20
          elif grep -Eq 'reverse_proxy (localhost|127\.0\.0\.1):8080' "$CADDY_FILE"; then
            systemctl is-active --quiet wigul-backend
            wait_health 8080 "8080 main" 20
          else
            echo "::error::Caddy must point to loopback:8080 or a healthy recovery standby on 8081"
            sudo -n sed -n '1,120p' "$CADDY_FILE" || true
            exit 1
          fi

          if ss -ltn | grep -q ':8081 '; then
            echo "::error::Port 8081 is already listening after recovery preflight"
            ss -ltnp 2>/dev/null | grep ':8081' || true
            exit 1
          fi

          if ss -ltn | grep -q ":$STANDBY_MANAGEMENT_PORT "; then
            echo "::error::Port $STANDBY_MANAGEMENT_PORT is already listening"
            ss -ltnp 2>/dev/null | grep ":$STANDBY_MANAGEMENT_PORT" || true
            exit 1
          fi

          sudo -n cp "$CADDY_FILE" "$CADDY_BACKUP"
          rm -f "$STANDBY_PID"

          echo
          echo "===== start 8081 standby ====="
          (
            cd "$APP_DIR"
            set -a
            . "$ENV_FILE"
            set +a
            export APP_PUSH_FCM_ENABLED=true
            export APP_PUSH_FCM_CREDENTIALS_LOCATION="file:/opt/wigul/secrets/firebase-adminsdk.json"
            exec /usr/bin/java \
              -Xms128m \
              -Xmx256m \
              -XX:MaxMetaspaceSize=128m \
              -jar "$CANDIDATE_JAR" \
              --server.address=127.0.0.1 \
              --server.port=8081 \
              --management.server.address=127.0.0.1 \
              --management.server.port="$STANDBY_MANAGEMENT_PORT" \
              --spring.datasource.hikari.maximum-pool-size=3
          ) > "$STANDBY_LOG" 2>&1 &
          echo "$!" > "$STANDBY_PID"
          echo "8081 standby pid=$(cat "$STANDBY_PID")"

          wait_health 8081 "8081 standby" 100
          require_loopback_listener 8081 "8081 standby"
          require_loopback_listener "$STANDBY_MANAGEMENT_PORT" "standby management"
          curl -fsS "http://127.0.0.1:$STANDBY_MANAGEMENT_PORT/actuator/health"
          echo
          curl -fsS -o /dev/null "http://127.0.0.1:$STANDBY_MANAGEMENT_PORT/actuator/prometheus"
          echo "8081 standby metrics OK"

          echo
          echo "===== switch caddy to 8081 ====="
          switch_caddy 8081
          CADDY_ON_8081=1
          curl -skfsS "https://$CADDY_SITE/health"
          echo
          require_sensitive_path_block

          echo
          echo "===== replace active jar and restart 8080 ====="
          cp "$ACTIVE_JAR" "$ACTIVE_BACKUP"
          cp "$CANDIDATE_JAR" "$ACTIVE_JAR"
          if [ "$SYSTEMD_MANAGEMENT_OVERRIDE" = "1" ]; then
            sudo -n systemctl unset-environment MANAGEMENT_SERVER_PORT
            SYSTEMD_MANAGEMENT_OVERRIDE=0
          fi
          sudo -n systemctl restart wigul-backend
          wait_health 8080 "8080 main" 120
          require_loopback_listener 8080 "8080 main"
          require_loopback_listener 9090 "8080 main management"

          echo
          echo "===== switch caddy back to 8080 ====="
          switch_caddy 8080
          CADDY_ON_8081=0
          curl -skfsS "https://$CADDY_SITE/health"
          echo
          require_sensitive_path_block

          echo
          echo "===== stop 8081 standby ====="
          kill "$(cat "$STANDBY_PID")" 2>/dev/null || true
          rm -f "$STANDBY_PID"
          wait_not_listening 8081 "8081 standby" 20
          wait_not_listening "$STANDBY_MANAGEMENT_PORT" "standby management" 20
          rm -f "$CANDIDATE_JAR"

          echo
          echo "===== final check ====="
          systemctl is-active caddy
          systemctl is-active wigul-backend
          systemctl is-active postgresql@15-main
          sudo -n sed -n '1,80p' "$CADDY_FILE"
          ss -ltnp 2>/dev/null | grep -E ':8080|:8081|:9090|:9091|:9092|:80|:443' || true
          curl -fsS http://127.0.0.1:8080/health
          echo
          curl -fsS http://127.0.0.1:9090/actuator/health
          echo
          curl -fsS -o /dev/null http://127.0.0.1:9090/actuator/prometheus
          echo "8080 main metrics OK"
          curl -skfsS "https://$CADDY_SITE/health"
          echo
          prune_deploy_artifacts
          df -h /
          free -h
          echo "deploy finished"
          REMOTE_DEPLOY
